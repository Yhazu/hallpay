<!-- /register.html --><!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="HALL-PAY Municipal Services"><title>Register — HALL-PAY</title><link rel="stylesheet" href="variables.css"><link rel="stylesheet" href="reset.css"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="components.css"><link rel="stylesheet" href="auth.css"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></head><body class="auth-body"><section class="auth-brand"><div class="auth-logo"><img src="logo2.jpg" alt="HALL-PAY logo" class="brand-logo-img">HALL-PAY</div><h1>Create your municipal services account.</h1><p>Register once, then apply, pay, and verify documents online.</p></section><main class="auth-panel"><form class="auth-card" id="registerForm"><h2>Create account</h2><div class="steps"><div class="step active"><span class="step-number">1</span><span class="step-label">Personal</span></div><div class="step pending"><span class="step-number">2</span><span class="step-label">Account</span></div><div class="step pending"><span class="step-number">3</span><span class="step-label">ID</span></div><div class="step pending"><span class="step-number">4</span><span class="step-label">Review</span></div></div><section class="reg-step"><input class="form-control mb-4" name="fullName" placeholder="Full Name" required><input class="form-control mb-4" type="email" name="email" placeholder="Email" required><input class="form-control mb-4" name="phone" placeholder="09XXXXXXXXX" required><input class="form-control mb-4" type="date" name="birthdate" required><textarea class="form-control" name="address" placeholder="Address" required></textarea></section><section class="reg-step" hidden><input class="form-control mb-4" type="password" name="password" placeholder="Password" required><div class="strength mb-4"><div class="strength-bar" id="strengthBar"></div></div><input class="form-control mb-4" type="password" name="confirmPassword" placeholder="Confirm Password" required><label><input type="checkbox" name="terms" required> I agree to the Terms and Privacy Policy</label></section><section class="reg-step" hidden><label class="upload-zone"><input type="file" name="validId" hidden><span class="material-symbols-outlined upload-zone-icon">badge</span><div>Upload a valid ID image</div><small>PNG or JPG accepted</small></label></section><section class="reg-step" hidden><div id="reviewBox" class="card-body"></div></section><div class="action-row mt-4"><button type="button" class="btn btn-secondary" id="prevBtn" disabled>Back</button><button type="button" class="btn btn-primary" id="nextBtn">Next</button><button class="btn btn-success" id="submitBtn" hidden>Confirm & Register</button></div><p class="mt-4">Already registered? <a href="/login.html">Sign in</a></p></form></main><div class="toast-container" id="toastContainer"></div><div class="loading-overlay" id="loadingOverlay" hidden><div class="spinner"></div></div><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script><script src="firebase-config.js"></script><script src="utils.js"></script><script src="ui.js"></script><script src="firestore.js"></script><script src="storage.js"></script><script src="auth.js"></script><script src="register.js"></script></body></html>
